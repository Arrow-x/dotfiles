# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$terminal = kitty --single-instance
$terminal_with_title = kitty --single-instance --app-id
# $browser = $BROWSER
$browser = brave-origin

source = $XDG_CONFIG_HOME/hypr/monitors.conf

ecosystem {
    no_update_news = true
}

input {
    kb_options = caps:swapescape,grp:alt_shift_toggle
    kb_layout = us,ara
    # repeat_delay = 400
    # repeat_rate = 35
    numlock_by_default = true
    follow_mouse = 2
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # monitor = LVDS-1, 1600x900@60, 0x0, 1
    # monitor = , preferred, auto, 1
    gaps_in = 2
    gaps_out = 2
    border_size = 2
    col.active_border = 0xffb4befe
    col.inactive_border = 0xff45475a
    layout = master
    no_focus_fallback = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 5
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = yes
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    animation = windowsIn, 1, 6, md3_decel, slide
    animation=windowsOut, 1,6,md3_decel,slide
    animation=windowsMove, 1,6,md3_decel,slide
    animation=fade, 1, 10, md3_decel
    animation=workspaces, 1, 7, md3_decel,slide
    animation=specialWorkspace, 1, 8, md3_decel, slide
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
	new_status = master
	new_on_top = true
    orientation = left
    mfact = 0.8
    # no_gaps_when_only = 1
}
misc {
    disable_hyprland_logo = true
}

workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, match:float 0, match:workspace f[1]
windowrule = rounding 0, match:float 0, match:workspace f[1]

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Execute your favorite apps at launch
exec-once = /usr/bin/snapshot-detect
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hash dbus-update-activation-environment 2>/dev/null && dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = nm-applet --indicator
exec-once = dunst --config $HOME/.config/dunst/dunstrc
exec-once = wl-paste --watch cliphist store
exec-once = wlsunset -l 36.736647 -L 3.100180
exec-once = foot -s
exec-once = sway-audio-idle-inhibit
exec-once = ideling.sh
exec-once = eos-update-notifier
exec-once = otd-daemon
exec-once = wljoywake

exec-once = $HOME/.local/bin/current_bg
exec-once = $HOME/.local/bin/binger

windowrule = persistent_size on, match:class .*

windowrule= float on, match:class ^(t_newsraft)$
windowrule= size 1400 900, match:class ^(t_newsraft)$
windowrule= center on, match:class ^(t_newsraft)$

windowrule= float on, match:class ^(t_cmus)$
windowrule= size 1400 900, match:class ^(t_cmus)$

windowrule= float on, match:class ^(deadbeef)$
windowrule= size 1400 900, match:class ^(deadbeef)$
windowrule= center on, match:class ^(deadbeef)$

windowrule= float on, match:class ^(t_lf)$
windowrule= size 1400 900, match:class ^(t_lf)$

windowrule= float on, match:class ^(t_yazi)$
windowrule= size 1400 900, match:class ^(t_yazi)$
windowrule= center on, match:class ^(t_yazi)$

windowrule= float on, match:class ^(t_btop)$
windowrule= size 1400 900, match:class ^(t_btop)$
windowrule= center on, match:class ^(t_btop)$

windowrule= float on, match:class ^(t_cht.sh)$
windowrule= size 1400 900, match:class ^(t_cht.sh)$
windowrule= center on, match:class ^(t_cht.sh)$

windowrule= float on, match:class ^(t_shit_poster)$
windowrule= size 1400 900, match:class ^(t_shit_poster)$
windowrule= center on, match:class ^(t_shit_poster)$

windowrule= float on, match:class ^(org.godotengine.ProjectManager)$
windowrule= size 1400 900, match:class ^(org.godotengine.ProjectManager)$
windowrule= center on, match:class ^(org.godotengine.ProjectManager)$

windowrule= float off, tile on, match:class  ^(Godot|org.godotengine.Editor)$

windowrule= float on, match:class ^(t_drop)$
windowrule= size 1910 500, match:class ^(t_drop)$
windowrule= move 5 2, match:class ^(t_drop)$

windowrule= float on, match:class ^(t_fzf_menu)$
windowrule= size 1910 500, match:class ^(t_fzf_menu)$
windowrule= move 5 2, match:class ^(t_fzf_menu)$


windowrule= float on, match:class ^(galculator)$
windowrule= size 406 355 ,match:class ^(galculator)$
windowrule= center on, match:class ^(galculator)$

windowrule= tile on, match:class ^(Nsxiv)$

windowrule= workspace 1, match:class ^(footclient|kitty)$
windowrule= workspace 2, match:class ^(mpv)$
windowrule= workspace 3, match:class ^((Chromium|firefox|librewolf|[Bb]rave-browser|brave-origin))(.*)$
windowrule= workspace 4, match:class ^(org.godotengine.(ProjectManager|Editor)|Godot)$
#workspace 5 reserved

windowrule= workspace 7, match:class ^([bB]lender|bforartists)$
windowrule= workspace 8, match:class ^([kK]rita)$
windowrule= workspace 9, match:class ^(pcmanfm|io.elementary.files)$

bind = , XF86MonBrightnessUp, exec, brightnessctl -q set 3%+
bind = , XF86MonBrightnessDown, exec, brightnessctl --min-val=2 -q set 3%-
bind = , XF86AudioPrev, exec,$HOME/.local/bin/pl_dmenu prev
bind = , XF86AudioNext, exec,$HOME/.local/bin/pl_dmenu next
bind = , XF86AudioPlay, exec,$HOME/.local/bin/pl_dmenu play-pause
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86HomePage, exec, $browser
bind = , Print, exec, printf 'window\noutput\nregion' | fuzzel --dmenu | xargs hyprshot -m
bind = SHIFT, Print , exec, hyprshot -z -m output -m HDMI-A-1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

bind = $mainMod,F,fullscreen
# bind = $mainMod ,n, layoutmsg,cyclenext
bind = $mainMod CONTROL ,SPACE, layoutmsg,swapwithmaster master
bind = $mainMod SHIFT,SPACE, togglefloating
bind = $mainMod,c ,killactive
bind = $mainMod,e ,togglegroup

bind = $mainMod , y, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = $mainMod SHIFT, y, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = $mainMod CONTROL, y, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = $mainMod,x , exec, killall -SIGUSR1 waybar
bind = $mainMod, SPACE, exec, rofi -show window -config $HOME/.config/rofi/arc_dark_colors.rasi
# bind = $mainMod, d, exec, $HOME/.local/bin/bemenu_run
bind = $mainMod, d, exec, fuzzel --list-executables-in-path
# bind = $mainMod, d, exec, dmenu_run
# bind = $mainMod Shift, d, exec, rofi -terminal $terminal -modi drun -show drun -config $HOME/.config/rofi/rofidmenu.rasi
# bind = $mainMod Shift, minus, movetoworkspacesilent, special
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, w, exec, $browser
bind = $mainMod SHIFT, m, exec, $HOME/.local/bin/monset
bind = $mainMod SHIFT, N, exec, io.elementary.files

# bind = $mainMod, z, exec,  hyprun t_shit_poster -- $terminal_with_title t_shit_poster shit_poster
bind = $mainMod, r, exec,  hyprun t_newsraft -- $terminal_with_title t_newsraft newsraft
# bind = $mainMod, semicolon, exec,  hyprun t_cmus -- $terminal_with_title t_cmus cmus
bind = $mainMod, semicolon, exec, hyprun deadbeef
bind = $mainMod, apostrophe, exec, hyprun t_btop -- $terminal_with_title t_btop btop
bind = $mainMod, tab, exec, hyprun t_drop -- $terminal_with_title t_drop
# bind = $mainMod, n, exec, hyprun t_lf -- $terminal_with_title t_lf lf
bind = $mainMod, n, exec, hyprun t_yazi -- $terminal_with_title t_yazi yazi
bind = $mainMod, m, exec, hyprun t_cht.sh -- $terminal_with_title t_cht.sh cht.sh

bind = $mainMod, u , exec, $HOME/.local/bin/pl_dmenu play-pause
bind = $mainMod SHIFT, u , exec, $HOME/.local/bin/pl_dmenu stop
bind = $mainMod, bracketright , exec, $HOME/.local/bin/pl_dmenu next
bind = $mainMod, bracketleft , exec, $HOME/.local/bin/pl_dmenu previous

bind = $mainMod, p , exec, $HOME/.local/bin/trackpad
bind = $mainMod SHIFT, p, exec, $HOME/.local/bin/lock.sh
bind = $mainMod, v, exec, paster

bind = $mainMod, b, exec, $HOME/.local/bin/select_bookmark --browser
bind = $mainMod SHIFT, b, exec, $HOME/.local/bin/bookmark

bind = $mainMod, q, exec,  clipboard_download --view
bind = $mainMod SHIFT, q, exec,  clipboard_download --download

bind = $mainMod, o, exec, proj --neovim
bind = $mainMod SHIFT, o, exec, proj --change-dir
bind = $mainMod CONTROL, o, exec, proj --local-configs
bind = $mainMod CONTROL SHIFT ,o, exec, proj --Local-configs-dir

bind = $mainMod, i, exec, $HOME/.local/bin/unicode_menu --emoji
bind = $mainMod SHIFT, i, exec, $HOME/.local/bin/unicode_menu --nerdfont

bind = $mainMod, s, exec, bitwarden-desktop
bind = $mainMod SHIFT,s, exec, $HOME/.local/bin/pass_menu --pass

# Move focus with mainMod + arrow keys
bind = $mainMod, l, movefocus, l
bind = $mainMod, h, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move focus with mainMod + arrow keys
bind = $mainMod, l, changegroupactive, l
bind = $mainMod, h, changegroupactive, r
bind = $mainMod, k, changegroupactive, u
bind = $mainMod, j, changegroupactive, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod, KP_End, workspace, 1
bind = $mainMod, KP_Down, workspace, 2
bind = $mainMod, KP_Next, workspace, 3
bind = $mainMod, KP_Left, workspace, 4
bind = $mainMod, KP_Begin, workspace, 5
bind = $mainMod, KP_Right, workspace, 6
bind = $mainMod, KP_Home, workspace, 7
bind = $mainMod, KP_Up, workspace, 8
bind = $mainMod, KP_Prior, workspace, 9
bind = $mainMod, KP_Insert, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT, KP_End, movetoworkspace, 1
bind = $mainMod SHIFT, KP_Down, movetoworkspace, 2
bind = $mainMod SHIFT, KP_Next, movetoworkspace, 3
bind = $mainMod SHIFT, KP_Left, movetoworkspace, 4
bind = $mainMod SHIFT, KP_Begin, movetoworkspace, 5
bind = $mainMod SHIFT, KP_Right, movetoworkspace, 6
bind = $mainMod SHIFT, KP_Home, movetoworkspace, 7
bind = $mainMod SHIFT, KP_Up, movetoworkspace, 8
bind = $mainMod SHIFT, KP_Prior, movetoworkspace, 9
bind = $mainMod SHIFT, KP_Insert, movetoworkspace, 10

bind = $mainMod CONTROL, l , workspace, e+1
bind = $mainMod CONTROL, h , workspace, e-1

bind = $mainMod SHIFT, l, movewindoworgroup , r
bind = $mainMod SHIFT, h, movewindoworgroup , l
bind = $mainMod SHIFT, k, movewindoworgroup , u
bind = $mainMod SHIFT, j, movewindoworgroup , d

bind = $mainMod ALT, l, resizeactive, 80 0
bind = $mainMod ALT, h, resizeactive, -80 0
bind = $mainMod ALT, k, resizeactive, 0 -80
bind = $mainMod ALT, j, resizeactive, 0 80

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
