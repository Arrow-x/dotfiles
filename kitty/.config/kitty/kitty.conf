# vim:fileencoding=utf-8:foldmethod=marker

font_size 12
force_ltr no
# font_family      FiraCode Nerd Font Mono Light
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

tab_bar_edge top
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
tab_bar_style separator

foreground #dddddd
background #000000


background_opacity 0.9

include themes/tokyonight_night.conf

map alt+h resize_window narrower
map alt+l resize_window wider
map alt+k resize_window taller
map alt+j resize_window shorter 3
# reset all windows in the tab to default sizes
map alt+0 resize_window reset


# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font Mono"
bold_font        auto
italic_font      family="Liberation Mono" style=Italic
bold_italic_font family="Liberation Mono" style='Bold Italic'
# END_KITTY_FONTS
